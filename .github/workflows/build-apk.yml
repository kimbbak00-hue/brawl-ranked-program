name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (runner preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build web bundle
        run: python3 tools/build_web.py

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log || {
            msg=$(grep -E "error:|ERROR|What went wrong|FAILURE|\.java:[0-9]+|Could not|>" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=gradle build failed::$msg"
            exit 1
          }

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk brawl-pickboard.apk
          ls -la brawl-pickboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: brawl-pickboard-apk
          path: brawl-pickboard.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest brawl-pickboard.apk \
            --title "브롤 픽보드 (최신, 빌드 ${{ github.run_number }})" \
            --notes "폰에서 brawl-pickboard.apk 를 받아 설치하세요. 커밋 ${{ github.sha }}" \
            --target ${{ github.sha }} --latest
